name: Bug report
description: Report incorrect behavior, a regression, or a device communication problem.
title: "bug: "
labels:
  - bug
body:
  - type: checkboxes
    id: preparation
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues for this problem.
          required: true
        - label: I closed the Elgato Stream Deck application and other programs that could own the device.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe what happened and how it differs from what you expected.
      placeholder: Tell us what you observed and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the smallest program or repository link that demonstrates the problem.
      placeholder: |
        1. Open the device with ...
        2. Call ...
        3. Observe ...
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Stream Deck model and USB product ID
      description: Run `go run ./examples/list` and include the model and product ID if known.
      placeholder: Stream Deck MK.2, 0x0080
    validations:
      required: true

  - type: input
    id: firmware
    attributes:
      label: Firmware version
      description: Run `go run ./examples/deviceinfo` when the device can be opened.
      placeholder: 1.00.003

  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - Linux
        - Windows
        - macOS
        - Other
    validations:
      required: true

  - type: dropdown
    id: architecture
    attributes:
      label: Architecture
      options:
        - AMD64 / x86-64
        - ARM64
        - ARM (32-bit)
        - Other
    validations:
      required: true

  - type: input
    id: versions
    attributes:
      label: Go and streamdeck-go versions
      description: Include `go version` and the module version or commit.
      placeholder: Go 1.27.1, streamdeck-go commit 7b2c950
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Remove serial numbers or other private data. This field is formatted as code.
      render: shell

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add any other details that may help reproduce or diagnose the problem.
